id: struct-001-dangling-edge
title: Dangling edge target must produce ERROR
description: >
  Core structural invariant of the justification graph: an edge pointing at
  a target that resolves to nothing (no title, alias, prodos.id, or
  content-block match) must be flagged as an ERROR, not silently accepted.
  Protects Index.resolve() and the dangling-edge branch in lint_file()
  against a future refactor quietly loosening resolution.
fixtures:
  - name: source.md
    content: |
      ---
      title: Regression Fixture — Dangling Edge Source
      type: claim
      tags: [test]
      conformant: true
      ---
      [supports:: [[Nonexistent Target That Should Never Resolve]]]
expect:
  - level: ERROR
    contains: "dangling edge"
